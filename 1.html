<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GGB Demo</title>
    <script src="https://cdn.geogebra.org/apps/deployggb.js"></script>
<script>
function capitalise([first,...rest]) {
    return first.toUpperCase()+rest.join('');
}
function clean_attribute(v) {
    if(v && !isNaN(v)) {
        v = parseFloat(v);
    }
    const map = {
        'true':true,
        'on':true,
        'false':false,
        'off':false
    };
    return Object.prototype.hasOwnProperty.call(map,v) ? map[v] : v;
}

class GeogebraApplet extends HTMLElement {
    constructor(){
        super();
        this.wrapper = null;
        this.api = null; // 真实GGB API对象
    }
    connectedCallback(){
        const attrs = {};
        for(let a of this.attributes){
            attrs[a.name] = clean_attribute(a.value);
        }
        const params = {
            appName: "classic",
            width: attrs.width || 600,
            height: attrs.height || 400,
            showToolBar: clean_attribute(attrs.showtoolbar ?? true),
            showAlgebraInput: clean_attribute(attrs.showalgebrainput ?? true),
            showMenuBar: clean_attribute(attrs.showmenubar ?? true),
            enableRightClick: clean_attribute(attrs.enablerightclick ?? true),
            enableShiftDragZoom: clean_attribute(attrs.enabledragzoom ?? true),
            borderColor:"#FFFFFF"
        };
        this.innerHTML = "";
        const div = document.createElement("div");
        this.appendChild(div);
        this.wrapper = new GGBApplet(params, true);
        this.wrapper.inject(div);
        // 等待内核就绪，获取真实api实例
        const poll = ()=>{
            const obj = this.wrapper.getAppletObject();
            if(obj){
                this.api = obj;
            }else{
                setTimeout(poll, 100);
            }
        };
        poll();
    }
}
// ASCII普通减号 geogebra-applet
customElements.define('geogebra-applet', GeogebraApplet);
</script>
</head>
<body>

<geogebra-applet width="800" height="500"></geogebra-applet>
<button id="btn">JS动态画圆</button>

<script>
const btn = document.querySelector("#btn");
const ggbEl = document.querySelector("geogebra-applet");

btn.onclick = function(){
    if(!ggbEl.api){
        alert("GeoGebra还未加载完成，请稍后点击");
        return;
    }
    const api = ggbEl.api;
    api.evalCommand("A=(-2,0)");
    api.evalCommand("B=(2,0)");
    api.evalCommand("C=(0,3)");
    api.evalCommand("Polygon(A,B,C)");
    api.evalCommand("Circle((0,0),1.5)");
};
</script>

</body>
</html>
